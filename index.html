<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>USD / RUB — живой курс</title>
  <style>
    :root{color-scheme:dark;--bg:#090b10;--card:#141823;--line:#69e19e;--muted:#8991a3}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 0,#1d2a38,transparent 42%),var(--bg);color:#f7f8fb;font-family:Inter,system-ui,sans-serif}
    main{width:min(920px,calc(100% - 32px));padding:clamp(22px,5vw,52px);border:1px solid #ffffff1c;border-radius:32px;background:#121620cc;box-shadow:0 30px 90px #0008;backdrop-filter:blur(24px)}
    header{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}.label,.status{color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
    h1{margin:14px 0 0;font-size:clamp(54px,11vw,112px);line-height:.85;letter-spacing:-.075em}.unit{font-size:.28em;color:var(--muted);letter-spacing:0}
    .change{margin-top:20px;font-size:16px}.up{color:#69e19e}.down{color:#ff7d88}.chart{height:330px;margin:40px -8px 22px;position:relative}
    canvas{width:100%;height:100%}.footer{display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:13px}.error{color:#ff9da5}
    @media(max-width:600px){main{border-radius:24px}.chart{height:240px;margin-top:30px}.footer{flex-direction:column;gap:6px}}
  </style>
</head>
<body>
<main>
  <header>
    <div><div class="label">Доллар США · Российский рубль</div><h1><span id="rate">—</span><span class="unit"> ₽</span></h1><div id="change" class="change">Загружаю данные…</div></div>
    <div class="status">USD / RUB</div>
  </header>
  <div class="chart"><canvas id="chart" aria-label="График курса USD к RUB за 14 дней"></canvas></div>
  <div class="footer"><span id="period">Последние 14 дней</span><span id="updated">Обновление…</span></div>
</main>
<script>
const rateEl=document.querySelector('#rate'),changeEl=document.querySelector('#change'),updatedEl=document.querySelector('#updated'),canvas=document.querySelector('#chart');
const api=date=>`https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@${date}/v1/currencies/usd.json`;
const iso=d=>d.toISOString().slice(0,10);
async function load(){
  try{
    const days=[...Array(14)].map((_,i)=>{const d=new Date();d.setUTCDate(d.getUTCDate()-13+i);return iso(d)});
    const settled=await Promise.allSettled(days.map(async d=>{const r=await fetch(api(d));if(!r.ok)throw 0;const j=await r.json();return{date:d,value:j.usd.rub}}));
    let data=settled.filter(x=>x.status==='fulfilled').map(x=>x.value);
    if(data.length<2){const r=await fetch(api('latest'));const j=await r.json();data=[{date:iso(new Date()),value:j.usd.rub}]}
    const last=data.at(-1),prev=data.at(-2)||last,delta=last.value-prev.value;
    rateEl.textContent=last.value.toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});
    changeEl.textContent=`${delta>=0?'▲':'▼'} ${Math.abs(delta).toFixed(2)} ₽ к предыдущему значению`;
    changeEl.className='change '+(delta>=0?'up':'down');
    updatedEl.textContent='Обновлено '+new Date().toLocaleString('ru-RU',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'long'});
    draw(data);
  }catch(e){changeEl.textContent='Не удалось загрузить курс. Попробуйте обновить страницу.';changeEl.className='change error';updatedEl.textContent='Нет соединения'}
}
function draw(data){
  const dpr=devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;canvas.width=w*dpr;canvas.height=h*dpr;
  const c=canvas.getContext('2d');c.scale(dpr,dpr);c.clearRect(0,0,w,h);
  const values=data.map(x=>x.value),min=Math.min(...values),max=Math.max(...values),span=max-min||1,p=16;
  const point=(v,i)=>[p+i*(w-2*p)/Math.max(data.length-1,1),p+(max-v)*(h-2*p)/span];
  const grad=c.createLinearGradient(0,0,0,h);grad.addColorStop(0,'#69e19e55');grad.addColorStop(1,'#69e19e00');
  c.beginPath();values.forEach((v,i)=>{const [x,y]=point(v,i);i?c.lineTo(x,y):c.moveTo(x,y)});c.lineTo(w-p,h);c.lineTo(p,h);c.closePath();c.fillStyle=grad;c.fill();
  c.beginPath();values.forEach((v,i)=>{const [x,y]=point(v,i);i?c.lineTo(x,y):c.moveTo(x,y)});c.strokeStyle='#69e19e';c.lineWidth=3;c.lineJoin='round';c.lineCap='round';c.stroke();
}
load();setInterval(load,15*60*1000);addEventListener('resize',load);
</script>
</body>
</html>
